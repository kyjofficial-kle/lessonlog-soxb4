/* Layout: 휴대폰에서 위에서 아래로 읽는 한 줄 리포트. 흰 종이 위 붉은 채점펜 한 가지 강조색. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --sunk:#f6f7f9; --ink:#15181e; --ink2:#464d5b; --muted:#7a8191; --faint:#a6acb7;
  --line:#e4e7ec; --line2:#d0d5dd; --accent:#e0344d; --accent-ink:#c0213a; --accent-soft:#fdecef;
  --good:#11804a; --good-soft:#e2f4ea; --warn:#9a6200; --warn-soft:#fbf0d9;
  --s0:#2a78d6; --s1:#eb6834; --s2:#1baf7a;
  --font:"Pretendard Sub","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(16,22,34,.04),0 4px 14px rgba(16,22,34,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0f13; --surface:#16191f; --sunk:#1c2027; --ink:#eef0f4; --ink2:#bac0cb; --muted:#8b93a1; --faint:#5f6674;
  --line:#262b34; --line2:#343b47; --accent:#ff5e74; --accent-ink:#ff8798; --accent-soft:#3a1820;
  --good:#4fd18e; --good-soft:#13301f; --warn:#f2b54d; --warn-soft:#33250b;
  --s0:#3987e5; --s1:#d95926; --s2:#199e70; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0f13; --surface:#16191f; --sunk:#1c2027; --ink:#eef0f4; --ink2:#bac0cb; --muted:#8b93a1; --faint:#5f6674;
  --line:#262b34; --line2:#343b47; --accent:#ff5e74; --accent-ink:#ff8798; --accent-soft:#3a1820;
  --good:#4fd18e; --good-soft:#13301f; --warn:#f2b54d; --warn-soft:#33250b;
  --s0:#3987e5; --s1:#d95926; --s2:#199e70; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-direction:column;gap:6px;padding:4px 2px 6px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
h1{font-size:30px;font-weight:800;margin:0;letter-spacing:-.035em;line-height:1.2}
.lede{color:var(--ink2);margin:0;font-size:14.5px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.stat .s{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 0;flex-wrap:wrap}
.card>header h2{font-size:17px;margin:0;font-weight:800;letter-spacing:-.03em}
.card>header .sub{font-size:13px;color:var(--muted)}
.card>.body{padding:12px 18px 18px}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-family:var(--font);font-size:11px;font-variant-numeric:tabular-nums}
.chart text.lab{fill:var(--ink);font-weight:800;font-size:12px}
.chart .cross{stroke:var(--line2);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;top:6px;pointer-events:none;background:var(--surface);border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:8px 10px;font-size:13px;min-width:150px;max-width:240px;z-index:5}
.tip b{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.tip em{font-style:normal;font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--c)}
.legend i.dia{width:9px;height:9px;border-radius:1px;transform:rotate(45deg);background:var(--ink2)}
.legend i.dot{width:9px;height:9px;border-radius:50%;background:transparent;border:2px solid var(--ink2)}
.legend i.dash{background:none;border-top:2px dashed var(--muted);height:0}
.tbl{overflow-x:auto;margin:0 -18px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-weight:600;color:var(--muted);text-align:left;font-size:12px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{padding-left:18px}
tr:last-child td{border-bottom:0}
.pill{display:inline-flex;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent-ink)}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:12px;font-weight:700;color:var(--ink2);border-radius:0 0 var(--r) var(--r);font-size:14px}
.more:hover{background:var(--sunk)}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;overflow-x:auto;padding-top:6px}
.bars .b{flex:1 0 14px;max-width:26px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bars .b div{width:100%;border-radius:4px 4px 0 0;background:var(--ink);opacity:.85;min-height:2px}
.bars .b.na div{background:transparent;border:1px dashed var(--line2);height:10px!important;border-radius:4px;opacity:1}
.bars .b span{font-size:9.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=search]{border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:8px 12px;min-width:0;width:220px;font-size:14px}
input[type=search]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.log{display:flex;flex-direction:column;padding:0 14px 4px}
.sess{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);padding:16px 18px;margin:0 0 12px}
.sess.empty{border:0;padding:6px 4px}
.sess .h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sess .h b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.sess .h span{font-size:13.5px;color:var(--muted)}
.hwm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;font-size:13px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.hwm .tr{flex:1;min-width:120px;max-width:260px;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.hwm .fl{display:block;height:100%;border-radius:4px;background:var(--c)}
.hwm .hwmemo{font-weight:500;color:var(--muted);font-size:12.5px}
.hwm.na{color:var(--muted);font-weight:500}
.blks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.blk{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.blk.wide{grid-column:1/-1}
.blk .bt{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em;margin-bottom:8px}
.blk .bt i{width:8px;height:8px;border-radius:50%;display:inline-block}
.prog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.prog li{display:flex;gap:8px;align-items:baseline;font-size:14px;line-height:1.55;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.tag{flex:none;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line2);color:var(--ink2)}
.hwl{margin:0;padding:0;list-style:none;counter-reset:h;display:flex;flex-direction:column;gap:7px}
.hwl li{counter-increment:h;display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14px;line-height:1.55;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.hwl li::before{content:counter(h);width:20px;height:20px;border-radius:50%;background:var(--good-soft);color:var(--good);font-size:11.5px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.blk.note{background:var(--surface);border-left:3px solid var(--accent)}
.blk.note p{margin:0;font-size:14.5px;line-height:1.75;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.resrow{display:flex;flex-wrap:wrap;gap:8px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:1px;min-width:120px}
.res .rk{font-size:12px;color:var(--muted);font-weight:700}
.res b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.res b small{font-size:12px;color:var(--muted);font-weight:500;margin-left:1px}
.res .rs{font-size:12.5px;color:var(--ink2)}
@media (max-width:620px){.blks{grid-template-columns:1fr}.sess{padding:14px 12px}.log{padding:0 8px 4px}.blk{padding:10px 12px}.month{margin:0 -8px;padding:0 8px}}
.month{border-top:1px solid var(--line)}
.month summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 4px;font-weight:800;font-size:15px}
.month summary::-webkit-details-marker{display:none}
.month summary::after{content:"펼치기";font-size:12.5px;font-weight:600;color:var(--muted)}
.month[open] summary::after{content:"접기"}
.month summary small{font-weight:500;color:var(--muted);font-size:13px;margin-left:8px}
.month{margin:0 -14px;padding:0 14px}
.month[open]{padding-bottom:4px}
.sect-lbl{font-size:12.5px;font-weight:700;color:var(--muted);padding:14px 4px 10px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding-top:6px;line-height:1.7}

  h1{font-size:26px}

  input[type=search]{width:100%}
  .tools{width:100%}
}
.mhd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:14px}
.mhd span{color:var(--muted);font-size:13px}
.mt tr.me td{background:color-mix(in srgb,var(--accent, #c0392b) 6%,transparent)}
.mt td,.mt th{text-align:center}.mt td:first-child,.mt th:first-child,.mt td:nth-child(2),.mt th:nth-child(2){text-align:left}
.gchip{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:8px;font-weight:800;font-size:13px}
.gchip.g1{background:#e3f4ea;color:#17803d}.gchip.g2{background:#eef7f1;color:#2a8a4c}.gchip.g3{background:#fdf2dc;color:#a8620a}.gchip.g4,.gchip.g5{background:#fbe6e4;color:#b23a2e}.gchip.na{background:var(--line);color:var(--muted)}

.advtext{font-size:15px;line-height:1.8;white-space:normal;word-break:keep-all}
.advsign{margin-top:10px;text-align:right;color:var(--muted);font-size:13px}
.uin{font-size:13px;color:var(--muted);margin-bottom:10px}
.ugrp{border-radius:12px;padding:12px 14px;margin-top:10px}
.ugrp.fit{background:#eaf6ee;box-shadow:inset 3px 0 0 #3fae5c}
.ugrp.reach{background:#fdf5dc;box-shadow:inset 3px 0 0 #e3b21c}
@media (prefers-color-scheme:dark){.ugrp.fit{background:#16301f}.ugrp.reach{background:#352b10}}
.uh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:8px}.uh b{font-size:15px}.uh span{font-size:12px;color:var(--muted)}
.urank{margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:6px}
.urank li{font-size:14px;line-height:1.5}.urank li::marker{color:var(--muted);font-size:12px}
.um{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin-left:8px}
.um i{font-style:normal;font-size:11.5px;color:var(--muted)}.um em{font-style:normal;font-size:11.5px;color:#a8620a}
.zn{font-size:11px;border-radius:5px;padding:0 6px;color:var(--muted);border:1px solid var(--line)}
.unote{margin:12px 0 0;font-size:12.5px;line-height:1.6;color:var(--muted)}
.ugrp>summary{list-style:none;cursor:pointer;position:relative;padding-right:28px}
.ugrp>summary::-webkit-details-marker{display:none}
.ugrp .uh{margin-bottom:4px}
.upeek{font-size:13px;color:var(--ink2,var(--muted));line-height:1.5}
.ugrp[open] .upeek{display:none}
.ugrp[open]>summary{margin-bottom:8px}
.utog{position:absolute;right:2px;top:2px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(127,127,127,.12)}
.utog::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .15s;opacity:.6}
.ugrp[open] .utog::before{transform:translateY(2px) rotate(-135deg)}
.simcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.simcard>summary{list-style:none;cursor:pointer;position:relative;padding-right:28px}
.simcard>summary::-webkit-details-marker{display:none}
.simcard[open] .upeek{display:none}.simcard[open]>summary{margin-bottom:6px}
.simcard[open] .utog::before{transform:translateY(2px) rotate(-135deg)}
.sct{display:flex;flex-direction:column;gap:2px}.sct b{font-size:15px}.sct span{font-size:12.5px;color:var(--muted)}
.ugrp.flat{margin-top:8px}
.newb{font-size:10.5px;font-weight:800;color:#fff;background:#d6453d;border-radius:5px;padding:0 5px}
</style>

<script>
window.__boot = (D) => {
"use strict";
document.title = `${D.student.display} 국어 수업 기록`;
const DOW = ["일","월","화","수","목","금","토"];
const SEL = { "화작":"화법과 작문", "언매":"언어와 매체" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const md = s => { const d = pd(s); return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`; };
const mdLong = s => { const d = pd(s); return `${d.getMonth()+1}월 ${d.getDate()}일`; };
const firstNum = v => { const m = String(v ?? "").match(/\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; };
const pctNum = v => { const m = String(v ?? "").match(/(\d+(?:\.\d+)?)\s*[-~]\s*(\d+(?:\.\d+)?)/); return m ? (parseFloat(m[1])+parseFloat(m[2]))/2 : firstNum(v); };
const sessions = D.sessions.slice().sort((a,b) => a.date.localeCompare(b.date));
const lessons = sessions.filter(s => s.kind === "lesson");
const exams = sessions.filter(s => s.exam && (s.exam.raw != null || s.exam.read != null)).map(s => ({...s.exam, date:s.date}));

function message(s){
  const unit = D.student.unit || "차시";
  const head = `${s.no!=null ? s.no+unit+" " : ""}${md(s.date)}`;
  if(s.kind === "absent") return head + " " + (s.note || "결석");
  const L = [];
  if(s.hwRate != null || s.hwMemo) L.push(`과제 완성도 : ${s.hwRate!=null ? s.hwRate+"%" : ""}${s.hwMemo ? (s.hwRate!=null ? ` (${s.hwMemo})` : s.hwMemo) : ""}`);
  const p = s.pretest; if(p && p.score != null) L.push(`Pre-test 결과 : ${p.score}/${p.total ?? "?"}${p.level ? ` (${/난이도/.test(p.level)?"":"난이도 "}${p.level})` : ""}`);
  (s.tests||"").split("\n").map(x=>x.trim()).filter(Boolean).forEach(q => { const m = q.match(/^(.+?)\s*:\s*(.*)$/); L.push(m ? `${m[1]} 결과 : ${m[2]}` : q); });
  const prog = (s.progress||"").trim(); if(prog) L.push(prog.includes("\n") ? "진도 기록 :\n" + prog : "진도 기록 : " + prog);
  const e = s.exam;
  if(e && (e.raw!=null || e.read!=null)){
    const par = [e.grade && `${e.grade}등급`, e.std != null && e.std !== "" && `표준점수 ${e.std}`, e.pct && `백분위 ${e.pct}`, e.cut && `1컷 ${e.cut}`].filter(Boolean).join(" / ");
    if(e.raw!=null) L.push(`${e.official ? e.title : (e.title || "모의고사")} 결과 : 원점수 ${e.raw}점${par ? ` (${par})` : ""}`);
    const det = [e.read!=null && `독서 ${e.read}/38`, e.lit!=null && `문학 ${e.lit}/38`, e.sel!=null && `${SEL[D.student.elective]||"선택"} ${e.sel}/24`].filter(Boolean).join(" - ");
    if(det) L.push("상세결과 : " + det);
    if(e.wrong) L.push("오답문항: " + e.wrong);
  }

const CH = {}; let n = 0;
function lineChart(o){
  const series = o.series.filter(s => s.pts.length); const all = series.flatMap(s => s.pts).concat(o.ref?.pts || []);
  if(!all.length) return `<div class="empty">${esc(o.empty)}</div>`;
  const id = "c" + (++n), W = 680, H = 250, L = 32, R = o.hlines ? 66 : 16, T = 18, B = 28;
  const ts = all.map(p => pd(p.date).getTime()); let t0 = Math.min(...ts), t1 = Math.max(...ts); if(t1 - t0 < 864e6){ t0 -= 432e6; t1 += 432e6; }
  const X = d => L + (W-L-R) * ((pd(d).getTime() - t0) / (t1 - t0));
  const vals = all.map(p => p.v).concat((o.hlines||[]).map(h => h.v));
  let lo = Math.max(0, Math.floor((Math.min(...vals) - 4) / 10) * 10), hi = o.yMax ?? Math.min(100, Math.ceil((Math.max(...vals) + 3) / 10) * 10);
  if(hi - lo < 20) lo = Math.max(0, hi - 20);
  const Y = v => T + (H-T-B) * (1 - (v-lo)/(hi-lo)); let g = "";
  const step = hi - lo > 60 ? 20 : hi - lo > 25 ? 10 : 5;
  for(let v = Math.ceil(lo/step)*step; v <= hi; v += step) g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-7}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  for(const h of o.hlines||[]){ const y = Y(h.v); g += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="5 4" opacity=".35"/><text x="${W-R+6}" y="${y+4}" style="fill:var(--accent-ink);opacity:.6">${h.label}</text>`; }
  const d0 = new Date(t0); let m = new Date(d0.getFullYear(), d0.getMonth() + (d0.getDate()>1?1:0), 1), lx = -99;
  while(m.getTime() <= t1){ const x = X(ymd(m)); if(x - lx > 34){ g += `<text x="${x}" y="${H-8}" text-anchor="middle">${m.getMonth()+1}월</text>`; lx = x; } m = new Date(m.getFullYear(), m.getMonth()+1, 1); }
  if(o.ref && o.ref.pts.length > 1) g += `<polyline fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4" points="${o.ref.pts.map(p=>`${X(p.date)},${Y(p.v)}`).join(" ")}"/>`;
  for(const s of series){
    if(s.pts.length > 1) g += `<polyline fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${s.pts.map(p=>`${X(p.date)},${Y(p.v)}`).join(" ")}"/>`;
    s.pts.forEach(p => { const x = X(p.date), y = Y(p.v); g += p.official ? `<rect x="${x-5}" y="${y-5}" width="10" height="10" rx="1.5" fill="${s.c}" stroke="var(--surface)" stroke-width="2" transform="rotate(45 ${x} ${y})"/>` : `<circle cx="${x}" cy="${y}" r="4" fill="var(--surface)" stroke="${s.c}" stroke-width="2"/>`; });
    if(o.labelLast){ const p = s.pts[s.pts.length-1]; g += `<text class="lab" x="${X(p.date)}" y="${Y(p.v)-10}" text-anchor="middle">${Math.round(p.v*10)/10}</text>`; }
  }
  g += `<line class="cross" x1="0" x2="0" y1="${T}" y2="${H-B}" visibility="hidden"/>`;
  CH[id] = { W, X, series };
  const lg = `<div class="legend">${series.length > 1 ? series.map(s => `<span><i style="--c:${s.c}"></i>${esc(s.name)}</span>`).join("") : ""}${o.ref && o.ref.pts.length ? `<span><i class="dash"></i>${esc(o.ref.name)}</span>` : ""}${o.hlines ? `<span><i style="--c:var(--accent);opacity:.45"></i>등급 경계</span>` : ""}${o.shapes ? `<span><i class="dia"></i>평가원·교육청</span><span><i class="dot"></i>사설 실전 모의고사</span>` : ""}</div>`;
  return `<div class="chart" data-c="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${g}<rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div></div>${lg}`;
}
function hover(ev){
  const box = ev.target.closest(".chart"); if(!box) return; const c = CH[box.dataset.c]; if(!c) return;
  const svg = box.querySelector("svg"), rc = svg.getBoundingClientRect(), sx = (ev.clientX - rc.left) * c.W / rc.width;
  let best = null; for(const s of c.series) for(const p of s.pts){ const d = Math.abs(c.X(p.date) - sx); if(!best || d < best.d) best = {d, date:p.date}; }
  if(!best) return;
  const rows = []; for(const s of c.series) s.pts.filter(p => p.date === best.date).forEach(p => rows.push(`<div>${esc(p.name)} <em>${esc(p.label)}</em></div>`));
  const x = c.X(best.date), cr = svg.querySelector(".cross"); cr.setAttribute("x1", x); cr.setAttribute("x2", x); cr.setAttribute("visibility","visible");
  const tip = box.querySelector(".tip"); tip.innerHTML = `<b>${md(best.date)}</b>${rows.join("")}`; tip.hidden = false;
  const px = x * rc.width / c.W, tw = tip.offsetWidth; tip.style.left = (px + 12 + tw > rc.width ? Math.max(0, px - tw - 12) : px + 12) + "px";
}
document.addEventListener("pointermove", ev => { if(ev.target.closest && ev.target.closest(".chart")) hover(ev); });

<script>
(async () => {
let E = JSON.parse(document.getElementById("enc").textContent);
const SHELL_V = 7;
try { const r = await fetch("data.json?t=" + Date.now(), { cache:"no-store" }); if(r.ok){ const j = await r.json();
  if(j && j.sv > SHELL_V){ let done = null; try { done = sessionStorage.getItem("lessonlog.sv"); } catch(e){}
    if(done !== String(j.sv)){ try { sessionStorage.setItem("lessonlog.sv", String(j.sv)); } catch(e){} location.replace(location.pathname + "?v=" + j.sv + location.hash); return; } }
  if(j && j.iv && j.ct) E = j; } } catch(e){}
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64url = s => b64(s.replace(/-/g,"+").replace(/_/g,"/") + "===".slice((s.length + 3) % 4));
const KEY = "lessonlog." + location.pathname;
async function unlock(k){
  const key = await crypto.subtle.importKey("raw", b64url(k), "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(E.iv) }, key, b64(E.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function show(D){ document.getElementById("lock").hidden = true; document.getElementById("app").hidden = false; window.__boot(D); }
function fail(msg){ document.getElementById("lockmsg").textContent = "기록을 열 수 없습니다"; document.getElementById("err").textContent = msg; }
(async () => {
  const m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
  let k = m ? m[1] : null, saved = null;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  if(!(window.crypto && crypto.subtle)) return fail("이 브라우저에서는 열 수 없습니다. 크롬이나 사파리로 열어 주세요.");
  for(const cand of [k, saved].filter(Boolean)){
    try { const D = await unlock(cand); try { localStorage.setItem(KEY, cand); } catch(e){} return show(D); } catch(e){}
  }
  fail(k ? "링크가 바뀌었거나 일부가 잘렸습니다. 선생님께 받은 링크 전체를 다시 눌러 주세요." : "선생님께 받은 링크 전체(# 뒷부분 포함)로 열어 주세요.");
})();
})();
